plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bedrockforge.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.bedrockforge.launcher"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // The Go proxy ships as a fake native lib (libmcproxy.so) so it can be
    // executed from nativeLibraryDir — Android 10+ blocks exec() from the app
    // data dir. Legacy packaging forces extraction of the lib to disk.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.code.gson:gson:2.10.1'
}
