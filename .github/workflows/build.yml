name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: proxy/go.sum

      - name: Run proxy tests
        working-directory: proxy
        run: go test ./...

      - name: Set up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # -checklinkname=0: wlynxg/anet (gophertunnel dep, android-only code
      # path) uses go:linkname to net.zoneCache, which Go 1.26 rejects by
      # default. The symbol still exists; the check is just stricter.
      - name: Build proxy for Android (arm64)
        working-directory: proxy
        run: |
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" \
            go build -trimpath -ldflags="-s -w -checklinkname=0" \
            -o ../app/src/main/jniLibs/arm64-v8a/libmcproxy.so .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Install only what the build needs — the action's default set includes
      # the emulator, which is a large flaky download we never use.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # apksigner (not jarsigner): Android 11+ requires an APK signature
      # scheme v2 signature, which jarsigner cannot produce. Align first,
      # then sign — v2 signing must happen after zipalign.
      - name: Sign and align APK
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/zipalign -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/BedrockForge.apk
          $BT/apksigner sign \
            --ks buildKey.jks \
            --ks-pass pass:bedrockforge123 \
            --key-pass pass:bedrockforge123 \
            --ks-key-alias bedrockforge \
            app/build/outputs/apk/release/BedrockForge.apk
          $BT/apksigner verify --print-certs app/build/outputs/apk/release/BedrockForge.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BedrockForge
          path: app/build/outputs/apk/release/BedrockForge.apk
