name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: proxy/go.sum

      - name: Run proxy tests
        working-directory: proxy
        run: go test ./...

      - name: Build proxy for Android (arm64)
        working-directory: proxy
        run: |
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" \
            go build -trimpath -ldflags="-s -w" \
            -o ../app/src/main/jniLibs/arm64-v8a/libmcproxy.so .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign and align APK
        run: |
          ZIPALIGN=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/zipalign
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore buildKey.jks \
            -storepass bedrockforge123 \
            -keypass bedrockforge123 \
            app/build/outputs/apk/release/app-release-unsigned.apk bedrockforge
          $ZIPALIGN -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/BedrockForge.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BedrockForge
          path: app/build/outputs/apk/release/BedrockForge.apk
